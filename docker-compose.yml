services:
  smp-server:
    image: ghcr.io/sdjvdf-distributed-computing/echo-server:main
    platform: linux/amd64
    ports:
      - "8443:8443"
    volumes:
      - smp-certs:/app/certs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8443 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  smp-certs:
