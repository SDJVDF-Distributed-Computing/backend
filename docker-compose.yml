services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "1234:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Smp__CertPath: certs/smpserver.cer
      Cors__AllowedOrigins__0: http://localhost:3000
      Cors__AllowedOrigins__1: http://127.0.0.1:3000
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - smp-server
    restart: unless-stopped

  smp-server:
    image: ghcr.io/sdjvdf-distributed-computing/echo-server:main
    platform: linux/amd64
    volumes:
      - ./certs:/app/certs:ro
    restart: unless-stopped
